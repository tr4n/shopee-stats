<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopee Analytics — Xem thống kê chi tiêu của tôi!</title>
  <link rel="icon" type="image/png" href="../extension/icons/icon128.png">

  <meta property="og:title" content="Xem thống kê chi tiêu Shopee của tôi!">
  <meta property="og:description" content="Tôi đã chi tiêu bao nhiêu tiền trên Shopee? Khám phá cùng Shopee Analytics.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <script>
    window.addEventListener('error', function(e) {
      var div = document.createElement('div');
      div.style.position = 'fixed';
      div.style.top = '0';
      div.style.left = '0';
      div.style.width = '100%';
      div.style.background = 'rgba(255, 0, 0, 0.9)';
      div.style.color = 'white';
      div.style.padding = '15px';
      div.style.zIndex = '999999';
      div.style.fontSize = '14px';
      div.style.fontFamily = 'monospace';
      div.style.whiteSpace = 'pre-wrap';
      div.innerHTML = '<strong>GLOBAL ERROR:</strong> ' + e.message + '<br>Stack: ' + (e.error ? e.error.stack : 'N/A');
      document.body.appendChild(div);
    });
    window.addEventListener('unhandledrejection', function(e) {
      var div = document.createElement('div');
      div.style.position = 'fixed';
      div.style.top = '0';
      div.style.left = '0';
      div.style.width = '100%';
      div.style.background = 'rgba(255, 100, 0, 0.9)';
      div.style.color = 'white';
      div.style.padding = '15px';
      div.style.zIndex = '999999';
      div.style.fontSize = '14px';
      div.style.fontFamily = 'monospace';
      div.style.whiteSpace = 'pre-wrap';
      div.innerHTML = '<strong>UNHANDLED REJECTION:</strong> ' + e.reason + '<br>Stack: ' + (e.reason && e.reason.stack ? e.reason.stack : 'N/A');
      document.body.appendChild(div);
    });
  </script>
  <div class="fluid-bg"></div>
  <canvas id="confetti-canvas"></canvas>

  <div class="story-container" id="story-frame">
    <!-- Story Progress Bar -->
    <div class="story-progress-bar" id="story-pb">
      <div class="story-progress-segment">
        <div class="story-progress-fill"></div>
      </div>
      <div class="story-progress-segment">
        <div class="story-progress-fill"></div>
      </div>
      <div class="story-progress-segment">
        <div class="story-progress-fill"></div>
      </div>
      <div class="story-progress-segment">
        <div class="story-progress-fill"></div>
      </div>
      <div class="story-progress-segment">
        <div class="story-progress-fill"></div>
      </div>
    </div>

    <!-- Slides wrap -->
    <div class="slides-wrap" id="slides-wrap">
      <!-- Will be rendered dynamically via JS -->
    </div>
  </div>

  <!-- Theme Toggle (top-left) -->
  <button id="btn-theme" class="btn-theme-pill" title="Chuyển Dark/Light Mode" aria-label="Toggle dark mode" style="display: none;">
    <span id="theme-icon">🌙</span>
    <span id="theme-label">Tối</span>
  </button>

  <!-- Floating Music Button (top-right) -->
  <button id="btn-music-float" style="display: none;" title="Bật/tắt nhạc nền">
    <span id="music-icon">🎵</span>
    <span class="eq-bars" id="eq-bars">
      <span class="eq-bar"></span>
      <span class="eq-bar"></span>
      <span class="eq-bar"></span>
      <span class="eq-bar"></span>
    </span>
    <span id="music-btn-label">Nhạc</span>
  </button>

  <!-- Actions Panel (bottom) -->
  <div id="actions-panel" class="actions-panel" style="display: none;">
    <button id="btn-download-img" class="action-btn btn-primary" title="Xem và lưu ảnh">💾 Ảnh</button>
    <button id="btn-download-vid" class="action-btn" title="Quay video Story">🎥 Video</button>
  </div>

  <!-- Image Preview Modal -->
  <div id="img-preview-overlay" class="img-preview-overlay">
    <div class="img-preview-frame" id="img-preview-frame">
      <div class="img-preview-loading" id="img-preview-loading">
        <div class="img-preview-spinner"></div>
        <span>Đang tạo ảnh...</span>
      </div>
    </div>
    <div class="img-preview-actions" id="img-preview-actions" style="display: none;">
      <button class="img-action-btn primary" id="btn-img-download">⬇️ Tải về</button>
      <button class="img-action-btn secondary" id="btn-img-copy">📋 Sao chép</button>
    </div>
  </div>

  <!-- Toast Message -->
  <div id="toast" class="toast"></div>

  <div id="error-root" style="display: none; width: 100%; max-width: 480px;"></div>

  <script src="script.js"></script>
</body>

</html>
