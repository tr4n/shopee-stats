<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopee Analytics Pro</title>
  <link rel="icon" type="image/png" href="../icons/icon128.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="logo">
        <img src="../icons/icon48.png" alt="Logo">
        <h1>Shopee Analytics</h1>
      </div>
      <button id="theme-toggle" class="icon-btn" title="Chuyển chế độ giao diện">
        <svg id="theme-icon" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
      </button>
    </header>

    <main class="main-content">
      <!-- Initial State -->
      <div id="initial-state" class="state-view active">
        <div class="hero-icon">💸</div>
        <h2 class="hero-title">Sẵn sàng chiêm ngưỡng?</h2>
        <p class="description">Hãy khám phá sự chấn động từ tổng chi tiêu trên Shopee của bạn.</p>



        <div id="cache-info" class="cache-info hidden">
          <span class="cache-icon">⚡</span>
          <span id="cache-badge-text" class="cache-badge-text"></span>
          <button id="btn-clear-cache" class="btn-cache-clear">Xóa</button>
        </div>

        <button id="btn-start" class="btn-primary">Bắt đầu thống kê ngay</button>
        <p id="error-message" class="error-text"></p>
      </div>

      <!-- Loading State -->
      <div id="loading-state" class="state-view">
        <div class="loader">
          <div class="spinner"></div>
        </div>
        <h2 class="loading-title">Đang thu thập dữ liệu...</h2>
        <div class="progress-wrapper">
          <div class="progress-bar-track">
            <div id="progress-bar-fill" class="progress-bar-fill"></div>
          </div>
          <p id="progress-text" class="progress-text">Vui lòng chờ trong giây lát</p>
        </div>
      </div>

      <!-- Result State -->
      <div id="result-state" class="state-view">
        <div class="summary-card glass">
          <h3 class="card-title">Tổng Chi Tiêu</h3>
          <h2 id="total-spent" class="huge-amount">0đ</h2>
          <div class="badge rank-badge" id="rank-badge">Tính toán...</div>
          <div id="trend-row" class="trend-row hidden"></div>
          <div id="percentile-row" class="percentile-row hidden">
            <span id="percentile-text" class="percentile-text"></span>
          </div>
        </div>

        <div class="action-row" style="flex-direction: column; gap: 12px; margin-top: 30px;">
          <button id="btn-open-dashboard" class="btn-primary" style="width: 100%; margin: 0; padding: 14px; background: linear-gradient(135deg, #26aa99 0%, #1c8d7e 100%); font-size: 15px; font-weight: bold;">📊 Xem chi tiết (Mở Dashboard)</button>
          <button id="btn-restart" class="btn-outline-sm" style="width: 100%; padding: 12px; font-size: 14px;">↺ Thống kê lại</button>
        </div>
      </div>
    </main>
  </div>
  <script src="share-card.js"></script>
  <script src="script.js"></script>
</body>
</html>
