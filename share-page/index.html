<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopee Analytics — Xem thống kê chi tiêu của tôi!</title>

  <meta property="og:title" content="Xem thống kê chi tiêu Shopee của tôi!">
  <meta property="og:description" content="Tôi đã chi tiêu bao nhiêu tiền trên Shopee? Khám phá cùng Shopee Analytics.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #ee4d2d;
      --primary-light: #ff7555;
      --green: #26aa99;
      --dark: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.08);
      --surface: rgba(15, 23, 42, 0.8);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--dark);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      margin: 0;
    }

    /* Animated background gradient */
    .fluid-bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #ee4d2d, #f64f59);
      background-size: 400% 400%;
      animation: fluidGrad 16s ease infinite;
      z-index: 0;
    }
    @keyframes fluidGrad {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Centered Story Frame */
    .story-container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
    }
    @media (min-width: 480px) {
      .story-container {
        border-radius: 28px;
        height: 92%;
        max-height: 820px;
      }
    }

    /* Story Progress Indicators */
    .story-progress-bar {
      display: flex;
      padding: 16px;
      gap: 6px;
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
    }
    .story-progress-segment {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }
    .story-progress-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
    }

    /* Slides Wrap */
    .slides-wrap {
      flex: 1;
      position: relative;
      margin-top: 30px; /* spacing for progress bar */
      display: flex;
      flex-direction: column;
      height: calc(100% - 30px);
    }

    .slide {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
    }
    .slide.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
      z-index: 2;
    }

    /* Glassmorphism Containers */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    /* Typography & Animations */
    .slide-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .slide-desc {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .huge-amount {
      font-size: clamp(36px, 9vw, 52px);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -1.5px;
      margin: 12px 0;
      text-shadow: 0 0 20px rgba(238, 77, 45, 0.4);
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      padding: 8px 16px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(238, 77, 45, 0.2) 0%, rgba(255, 117, 85, 0.2) 100%);
      color: #ff8a6f;
      font-size: 15px;
      font-weight: 700;
      border: 1px solid rgba(238, 77, 45, 0.3);
      box-shadow: 0 4px 12px rgba(238, 77, 45, 0.15);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 20px 0;
    }
    .stat-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 16px;
    }
    .stat-val {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
    }
    .stat-val.green {
      color: #5fe8cc;
    }
    .stat-lbl {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Top Item styling */
    .top-item-highlight {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
      text-align: center;
    }
    .top-item-emoji {
      font-size: 48px;
      animation: pulseEmoji 3s infinite ease-in-out;
    }
    @keyframes pulseEmoji {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.3)); }
      100% { transform: scale(1); }
    }
    .top-item-name {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Percentile Bar */
    .pct-bar-bg {
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
      margin: 16px 0;
    }
    .pct-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #5fe8cc, #26aa99);
      width: 0%;
      border-radius: 5px;
      transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Year Chart */
    .year-chart {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 20px 0;
    }
    .year-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .year-label {
      font-size: 13px;
      font-weight: 700;
      width: 45px;
      color: var(--text-muted);
    }
    .year-bar-track {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .year-bar-fill {
      height: 100%;
      background: rgba(255, 255, 255, 0.4);
      width: 0%;
      border-radius: 4px;
      transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .year-bar-fill.active-year {
      background: linear-gradient(90deg, #5fe8cc, #26aa99);
    }
    .year-val {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      min-width: 80px;
      text-align: right;
    }

    /* CTA Section */
    .cta-card {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .cta-btn {
      display: inline-flex;
      background: linear-gradient(135deg, var(--primary) 0%, #ff8a5a 100%);
      color: white !important;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      padding: 16px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(238, 77, 45, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
      justify-content: center;
    }
    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(238, 77, 45, 0.5);
    }
    .cta-btn:active {
      transform: translateY(0);
    }

    .sticker-slogan {
      background: rgba(255, 255, 255, 0.07);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 13px;
      color: #ffb86c;
      font-weight: 700;
      margin: 10px 0;
      animation: rotateSticker 6s infinite ease-in-out;
    }
    @keyframes rotateSticker {
      0% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg) scale(1.03); }
      100% { transform: rotate(-2deg); }
    }

    /* Footer Brand mark */
    .story-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 16px;
      margin-top: 20px;
    }
    .brand-logo {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--text-muted);
    }
    .brand-date {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.28);
    }

    /* Touch navigation overlay hint */
    .story-nav-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 5;
      pointer-events: none;
      display: flex;
    }
    .nav-zone-left {
      width: 30%;
      height: 100%;
      pointer-events: auto;
      cursor: w-resize;
    }
    .nav-zone-right {
      width: 70%;
      height: 100%;
      pointer-events: auto;
      cursor: e-resize;
    }

    /* Error */
    .error-msg {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255,255,255,0.7);
      position: relative;
      z-index: 10;
    }
    .error-msg h2 { color: #fff; margin-bottom: 10px; font-size: 22px; }

    /* Confetti canvas */
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>
  <div class="fluid-bg"></div>
  <canvas id="confetti-canvas"></canvas>
  
  <div class="story-container" id="story-frame">
    <!-- Story Progress Bar -->
    <div class="story-progress-bar" id="story-pb">
      <div class="story-progress-segment"><div class="story-progress-fill"></div></div>
      <div class="story-progress-segment"><div class="story-progress-fill"></div></div>
      <div class="story-progress-segment"><div class="story-progress-fill"></div></div>
      <div class="story-progress-segment"><div class="story-progress-fill"></div></div>
      <div class="story-progress-segment"><div class="story-progress-fill"></div></div>
    </div>

    <!-- Navigation touch overlays -->
    <div class="story-nav-overlay">
      <div class="nav-zone-left" id="nav-left"></div>
      <div class="nav-zone-right" id="nav-right"></div>
    </div>

    <!-- Slides wrap -->
    <div class="slides-wrap" id="slides-wrap">
      <!-- Will be rendered dynamically via JS -->
    </div>
  </div>

  <div id="error-root" style="display: none; width: 100%; max-width: 480px;"></div>

  <script>
  (function () {
    /* ====================================================
       Helpers
     ==================================================== */
    const RANKS = {
      1: 'Khách Tập Sự 👶',
      2: 'Khách Quen 🤝',
      3: 'Tín Đồ Cuồng Nhiệt 👑',
      4: 'Cổ Đông Chiến Lược 💎'
    };

    function fmtVND(n) {
      if (n < 0) return '***';
      n = Math.round(n || 0);
      if (n >= 1000000000) return (n / 1000000000).toFixed(1).replace('.0', '') + ' tỷ';
      if (n >= 1000000)    return (n / 1000000).toFixed(1).replace('.0', '')    + ' triệu';
      if (n >= 1000)       return Math.round(n / 1000) + 'k';
      return n.toLocaleString('vi-VN');
    }
    function fmtNum(n) { return Math.round(n || 0).toLocaleString('vi-VN'); }
    function fmtDate(ts) {
      if (!ts) return '';
      const d = new Date(ts * 1000);
      return `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
    }
    function escHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    /* ====================================================
       Counter animation
     ==================================================== */
    function animateCounter(el, targetText, duration) {
      const match = targetText.match(/^([\d,\.]+)(.*)$/);
      if (!match) { el.textContent = targetText; return; }

      const numStr = match[1].replace(/,/g, '');
      const suffix = match[2];
      const target = parseFloat(numStr);
      const isFloat = numStr.includes('.');
      const decimals = isFloat ? (numStr.split('.')[1] || '').length : 0;

      const start = performance.now();
      function step(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = target * eased;
        const formatted = isFloat
          ? current.toFixed(decimals).replace(/\B(?=(\d{3})+(?!\d))/g, ',')
          : Math.round(current).toLocaleString('vi-VN');
        el.textContent = formatted + suffix;
        if (progress < 1) requestAnimationFrame(step);
        else el.textContent = targetText;
      }
      requestAnimationFrame(step);
    }

    /* ====================================================
       Confetti (for top spenders: percentile >= 80)
     ==================================================== */
    let confettiActive = false;
    function launchConfetti() {
      if (confettiActive) return;
      confettiActive = true;
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = Array.from({ length: 90 }, () => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * 80,
        vx: (Math.random() - 0.5) * 3,
        vy: 2 + Math.random() * 3,
        rot: Math.random() * 360,
        rotV: (Math.random() - 0.5) * 8,
        w: 8 + Math.random() * 6,
        h: 4 + Math.random() * 4,
        color: ['#ee4d2d','#ff8a5a','#5fe8cc','#ffd700','#fff'][Math.floor(Math.random() * 5)],
        alpha: 1
      }));

      let frame = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.rotV;
          p.vy += 0.06;
          if (frame > 80) p.alpha -= 0.018;
          if (p.alpha <= 0) continue;
          alive = true;
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot * Math.PI / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
        frame++;
        if (alive) requestAnimationFrame(draw);
        else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          confettiActive = false;
        }
      }
      requestAnimationFrame(draw);
    }

    /* ====================================================
       Parse URL data
     ==================================================== */
    function parseData() {
      try {
        const match = location.hash.match(/[#&]d=([^&]+)/);
        if (!match) return null;
        return JSON.parse(decodeURIComponent(escape(atob(match[1]))));
      } catch { return null; }
    }

    /* ====================================================
       Render error
     ==================================================== */
    function renderError() {
      document.getElementById('story-frame').style.display = 'none';
      const errRoot = document.getElementById('error-root');
      errRoot.style.display = 'block';
      errRoot.innerHTML = `
        <div class="error-msg">
          <h2>Không tìm thấy dữ liệu</h2>
          <p>Link chia sẻ không hợp lệ hoặc đã hết hạn.</p>
        </div>
        <div style="text-align: center; margin-top: 24px; padding: 0 24px;">
          <a class="cta-btn" href="https://chromewebstore.google.com/detail/shopee-analytics-pro-th%E1%BB%91n/jcflofioiopfchfelgbpbndplhpfeapm" target="_blank">
            Cài Shopee Analytics Miễn Phí
          </a>
        </div>`;
    }

    /* ====================================================
       Main Render Slideshow
     ==================================================== */
    function renderSlideshow(d) {
      const rankLabel = RANKS[d.r] || RANKS[2];
      const beat = d.p || 0;
      const currentYear = new Date().getFullYear();

      // Top Item
      const hasTopItem = !!d.ti;
      const topName = d.ti ? escHtml(d.ti) : '';

      // Slide 1: Welcome & Total Spent
      const totalFmt = d.t < 0 ? '***' : fmtVND(d.t) + 'đ';
      const welcomeSlideHtml = `
        <div class="slide" id="slide-0">
          <div>
            <div class="slide-title">Shopee Analytics</div>
            <div class="slide-desc">Chào mừng bạn đến với tổng kết chi tiêu!</div>
          </div>
          <div class="glass-card" style="text-align: center; margin: auto 0;">
            <div style="font-size: 56px; margin-bottom: 16px;">🛍️</div>
            <div style="font-size: 12px; font-weight: 700; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase;">Tổng Chi Tiêu Của Tôi</div>
            <div class="huge-amount" id="welcome-spent">0đ</div>
            <div class="rank-badge" style="margin-top: 10px;">${escHtml(rankLabel)}</div>
          </div>
          <div class="story-footer">
            <span class="brand-logo">SHOPEE STATS</span>
            <span class="brand-date">${fmtDate(d.ts)}</span>
          </div>
        </div>`;

      // Slide 2: Percentile & Stats Grid
      const savedFmt = d.s < 0 ? '***' : fmtVND(d.s) + 'đ';
      const statsSlideHtml = `
        <div class="slide" id="slide-1">
          <div>
            <div class="slide-title">Xếp hạng của bạn</div>
            <div class="slide-desc">Bạn là chiến thần mua sắm cấp độ nào?</div>
          </div>
          <div class="glass-card" style="margin: auto 0;">
            <div style="font-size: 15px; font-weight: 700; margin-bottom: 6px;">Chi tiêu nhiều hơn ~${beat}% người dùng VN</div>
            <div class="pct-bar-bg">
              <div class="pct-bar-fill" id="pct-bar-fill"></div>
            </div>
            <div class="stats-grid">
              <div class="stat-box">
                <div class="stat-val" id="stat-orders">0</div>
                <div class="stat-lbl">Đơn hàng</div>
              </div>
              <div class="stat-box">
                <div class="stat-val" id="stat-items">0</div>
                <div class="stat-lbl">Sản phẩm</div>
              </div>
              <div class="stat-box" style="grid-column: span 2;">
                <div class="stat-val green" id="stat-saved">0đ</div>
                <div class="stat-lbl">Tiết kiệm được</div>
              </div>
            </div>
          </div>
          <div class="story-footer">
            <span class="brand-logo">SHOPEE STATS</span>
            <span class="brand-date">${fmtDate(d.ts)}</span>
          </div>
        </div>`;

      // Slide 3: Top Item
      const topItemSlideHtml = `
        <div class="slide" id="slide-2">
          <div>
            <div class="slide-title">Mối tình đậm sâu</div>
            <div class="slide-desc">Sản phẩm gắn bó nhất cùng bạn trong hành trình qua</div>
          </div>
          <div class="glass-card" style="margin: auto 0; text-align: center;">
            <div class="top-item-highlight">
              <div class="top-item-emoji">👑</div>
              <div style="font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 1px;">Sản phẩm mua nhiều nhất</div>
              <div class="top-item-name" style="margin: 8px 0;">${hasTopItem ? topName : 'Không có thông tin sản phẩm'}</div>
              <div style="font-size: 14px; color: var(--text-muted); font-weight: 600; margin-top: 10px;">
                Đã đồng hành cùng ví tiền của bạn!
              </div>
            </div>
          </div>
          <div class="story-footer">
            <span class="brand-logo">SHOPEE STATS</span>
            <span class="brand-date">${fmtDate(d.ts)}</span>
          </div>
        </div>`;

      // Slide 4: Yearly Breakdown
      const maxVal = Array.isArray(d.yd) ? Math.max(...d.yd.map(([, v]) => v), 1) : 1;
      const chartRowsHtml = Array.isArray(d.yd) ? d.yd.map(([y, v]) => {
        const pct = Math.round((v / maxVal) * 100);
        const isCurrent = Number(y) === currentYear;
        const valFmt = v < 0 ? '***' : fmtVND(v) + 'đ';
        return `
          <div class="year-row">
            <div class="year-label">${y}</div>
            <div class="year-bar-track">
              <div class="year-bar-fill ${isCurrent ? 'active-year' : ''}" data-pct="${pct}"></div>
            </div>
            <div class="year-val">${valFmt}</div>
          </div>`;
      }).join('') : '<div style="text-align:center;color:var(--text-muted);">Không có dữ liệu năm</div>';

      const yearlySlideHtml = `
        <div class="slide" id="slide-3">
          <div>
            <div class="slide-title">Dòng chảy thời gian</div>
            <div class="slide-desc">Biến động chi tiêu của bạn qua các năm</div>
          </div>
          <div class="glass-card" style="margin: auto 0;">
            <div class="year-chart">
              ${chartRowsHtml}
            </div>
          </div>
          <div class="story-footer">
            <span class="brand-logo">SHOPEE STATS</span>
            <span class="brand-date">${fmtDate(d.ts)}</span>
          </div>
        </div>`;

      // Slide 5: CTA
      const slogans = [
        "Kiếp này xin lỗi ví tiền! 💸",
        "Mua sắm vì đam mê, không vì cần! 🛍️",
        "Bàn tay vàng trong làng chốt đơn! 👑",
        "Kiểm soát chi tiêu, làm chủ tương lai! 💎",
        "Chốt đơn xuyên đêm, quên sầu ví rỗng! 🦉"
      ];
      const randomSlogan = slogans[Math.floor(Math.random() * slogans.length)];

      const ctaSlideHtml = `
        <div class="slide" id="slide-4">
          <div>
            <div class="slide-title">Đến lượt bạn</div>
            <div class="slide-desc">Khám phá và chia sẻ câu chuyện chi tiêu của riêng bạn</div>
          </div>
          <div class="glass-card cta-card" style="margin: auto 0;">
            <div class="sticker-slogan">${randomSlogan}</div>
            <div style="font-size: 15px; font-weight: 600; line-height: 1.5; margin-bottom: 8px;">
              Xem thống kê chi tiêu Shopee của bạn với tiện ích <strong>Shopee Analytics</strong> chạy offline 100% cục bộ.
            </div>
            <a class="cta-btn" href="https://chromewebstore.google.com/detail/shopee-analytics-pro-th%E1%BB%91n/jcflofioiopfchfelgbpbndplhpfeapm" target="_blank">
              Cài Đặt Tiện Ích Miễn Phí
            </a>
          </div>
          <div class="story-footer">
            <span class="brand-logo">SHOPEE STATS</span>
            <span class="brand-date">${fmtDate(d.ts)}</span>
          </div>
        </div>`;

      const slidesWrap = document.getElementById("slides-wrap");
      slidesWrap.innerHTML = welcomeSlideHtml + statsSlideHtml + topItemSlideHtml + yearlySlideHtml + ctaSlideHtml;

      // Slides logic
      const slides = Array.from(document.querySelectorAll(".slide"));
      const progressFills = Array.from(document.querySelectorAll(".story-progress-fill"));
      const nSlides = slides.length;

      let currentIdx = 0;
      let progress = 0;
      let lastTime = performance.now();
      let isPaused = false;
      const slideDuration = 5000;
      let animationFrameId = null;

      function showSlide(idx) {
        currentIdx = idx;
        progress = 0;
        
        slides.forEach((slide, sIdx) => {
          slide.classList.toggle("active", sIdx === idx);
        });

        progressFills.forEach((fill, fIdx) => {
          if (fIdx < idx) {
            fill.style.width = "100%";
          } else {
            fill.style.width = "0%";
          }
        });

        triggerSlideAnimations(idx);
      }

      function triggerSlideAnimations(idx) {
        if (idx === 0) {
          const totalEl = document.getElementById("welcome-spent");
          if (totalEl) animateCounter(totalEl, totalFmt, 1200);
          if (beat >= 80) setTimeout(launchConfetti, 300);
        } else if (idx === 1) {
          const fill = document.getElementById("pct-bar-fill");
          if (fill) fill.style.width = beat + '%';
          
          const svOrders = document.getElementById("stat-orders");
          const svItems = document.getElementById("stat-items");
          const svSaved = document.getElementById("stat-saved");
          if (svOrders) animateCounter(svOrders, fmtNum(d.o), 900);
          if (svItems) animateCounter(svItems, fmtNum(d.ip), 900);
          if (svSaved) animateCounter(svSaved, savedFmt, 900);
          if (beat >= 80) setTimeout(launchConfetti, 300);
        } else if (idx === 3) {
          document.querySelectorAll("#slide-3 .year-bar-fill").forEach((bar, bIdx) => {
            setTimeout(() => {
              bar.style.width = bar.getAttribute("data-pct") + '%';
            }, bIdx * 100);
          });
        }
      }

      function nextSlide() {
        if (currentIdx < nSlides - 1) {
          showSlide(currentIdx + 1);
        } else {
          showSlide(0);
        }
      }

      function prevSlide() {
        if (currentIdx > 0) {
          showSlide(currentIdx - 1);
        } else {
          showSlide(0);
        }
      }

      function loop(now) {
        const delta = now - lastTime;
        lastTime = now;

        if (!isPaused) {
          progress += (delta / slideDuration) * 100;
          if (progress >= 100) {
            progress = 0;
            nextSlide();
          } else {
            if (progressFills[currentIdx]) {
              progressFills[currentIdx].style.width = `${progress}%`;
            }
          }
        }
        animationFrameId = requestAnimationFrame(loop);
      }

      const storyFrame = document.getElementById("story-frame");
      
      document.getElementById("nav-left").addEventListener("click", (e) => {
        e.stopPropagation();
        prevSlide();
      });

      document.getElementById("nav-right").addEventListener("click", (e) => {
        e.stopPropagation();
        nextSlide();
      });

      const pauseStart = () => { isPaused = true; };
      const pauseEnd = () => { isPaused = false; lastTime = performance.now(); };

      storyFrame.addEventListener("mousedown", pauseStart);
      storyFrame.addEventListener("mouseup", pauseEnd);
      storyFrame.addEventListener("mouseleave", pauseEnd);
      storyFrame.addEventListener("touchstart", pauseStart);
      storyFrame.addEventListener("touchend", pauseEnd);

      showSlide(0);
      lastTime = performance.now();
      animationFrameId = requestAnimationFrame(loop);
    }

    /* ====================================================
       Boot
     ==================================================== */
    const data = parseData();
    if (!data || !data.t) {
      renderError();
    } else {
      renderSlideshow(data);
    }
  })();
  </script>
</body>
</html>
