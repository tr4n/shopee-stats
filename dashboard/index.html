<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopee Analytics — Đang tải...</title>
  <link rel="icon" type="image/png" href="../extension/icons/icon128.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f4f6f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1e293b;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      max-width: 380px;
      width: 90%;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      margin: 0 auto 20px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(238, 77, 45, 0.15);
      border-top-color: #ee4d2d;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 24px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .sub {
      font-size: 13px;
      color: rgba(30, 41, 59, 0.5);
      line-height: 1.6;
    }

    .error-icon {
      font-size: 44px;
      margin-bottom: 16px;
      display: none;
    }

    .error-box {
      margin-top: 20px;
      padding: 12px 16px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 10px;
      font-size: 13px;
      color: #ef4444;
      line-height: 1.5;
      display: none;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #ee4d2d;
      color: #fff;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }

    .btn:hover { opacity: 0.88; }
  </style>
</head>

<body>
  <div class="card">
    <img class="logo" src="../extension/icons/icon128.png" alt="Logo" onerror="this.style.display='none'">
    <div class="spinner" id="spinner"></div>
    <div class="error-icon" id="error-icon">⚠️</div>
    <div class="title" id="title">Đang xử lý dữ liệu...</div>
    <div class="sub" id="sub">Lưu dữ liệu Shopee vào bộ nhớ cục bộ</div>
    <div class="error-box" id="error-box"></div>
    <a class="btn" id="btn-reload" style="display:none" href="index.html">Thử lại</a>
  </div>

  <script>
    (function () {
      const PREFIX = 'shopee_dash_data_';

      function tryParse(raw) {
        if (!raw) return null;
        const trimmed = raw.trim();

        // Try raw JSON first (in case someone pastes JSON directly)
        try { return JSON.parse(trimmed); } catch { /* noop */ }

        // Try base64 — restore + chars that URL encoding may have turned into spaces
        for (const s of [trimmed.replace(/ /g, '+'), trimmed]) {
          try {
            const bin = atob(s);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return JSON.parse(new TextDecoder().decode(bytes));
          } catch { /* noop */ }
        }
        return null;
      }

      function showError(msg) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('error-icon').style.display = 'block';
        document.getElementById('title').textContent = 'Không tải được dữ liệu';
        document.getElementById('sub').textContent = '';
        document.getElementById('error-box').style.display = 'block';
        document.getElementById('error-box').textContent = msg;
        document.getElementById('btn-reload').style.display = 'inline-block';
      }

      // Detect data from #d= hash (priority) or ?d= query param
      const hashMatch = location.hash.match(/[#&]d=([^&]+)/);
      const qMatch = location.search.match(/[?&]d=([^&]*)/);
      const raw = hashMatch?.[1] || qMatch?.[1];

      if (!raw) {
        showError('Không tìm thấy dữ liệu trong URL. Hãy mở lại từ extension Shopee Analytics.');
        return;
      }

      const parsed = tryParse(raw);
      if (!parsed || !parsed.t) {
        showError('Dữ liệu không hợp lệ hoặc bị hỏng. Hãy xuất lại dữ liệu từ extension.');
        return;
      }

      // Store with millis ID
      const id = Date.now();
      try {
        localStorage.setItem(PREFIX + id, JSON.stringify(parsed));
      } catch (e) {
        showError('Không thể lưu dữ liệu (bộ nhớ đầy?): ' + e.message);
        return;
      }

      // Update UI briefly then redirect
      document.getElementById('sub').textContent = '✓ Đã lưu — đang chuyển sang dashboard...';

      setTimeout(() => {
        location.replace('result.html?id=' + id);
      }, 400);
    })();
  </script>
</body>

</html>
