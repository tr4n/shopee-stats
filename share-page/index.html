<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopee Analytics — Xem thống kê chi tiêu của tôi!</title>

  <meta property="og:title" content="Xem thống kê chi tiêu Shopee của tôi!">
  <meta property="og:description" content="Tôi đã chi tiêu bao nhiêu tiền trên Shopee? Khám phá cùng Shopee Analytics.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #ee4d2d;
      --primary-light: #ff7555;
      --green: #26aa99;
      --dark: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.08);
      --surface: rgba(15, 23, 42, 0.8);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--dark);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      margin: 0;
    }

    /* Animated background gradient */
    .fluid-bg {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #ee4d2d, #f64f59);
      background-size: 400% 400%;
      animation: fluidGrad 16s ease infinite;
      z-index: 0;
    }

    @keyframes fluidGrad {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* Centered Story Frame */
    .story-container {
      width: 100%;
      max-width: 480px;
      height: calc(100% - 90px);
      margin-bottom: 90px;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
    }

    @media (min-width: 480px) {
      .story-container {
        border-radius: 28px;
        height: 84%;
        max-height: 720px;
        margin-bottom: 80px;
      }
    }

    /* Story Progress Indicators */
    .story-progress-bar {
      display: flex;
      padding: 16px;
      gap: 6px;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
    }

    .story-progress-segment {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }

    .story-progress-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
    }

    /* Slides Wrap */
    .slides-wrap {
      flex: 1;
      position: relative;
      margin-top: 30px;
      /* spacing for progress bar */
      display: flex;
      flex-direction: column;
      height: calc(100% - 30px);
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
      z-index: 2;
    }

    /* Glassmorphism Containers */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    /* Typography & Animations */
    .slide-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .slide-desc {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .huge-amount {
      font-size: clamp(36px, 9vw, 52px);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -1.5px;
      margin: 12px 0;
      text-shadow: 0 0 20px rgba(238, 77, 45, 0.4);
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      padding: 8px 16px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(238, 77, 45, 0.2) 0%, rgba(255, 117, 85, 0.2) 100%);
      color: #ff8a6f;
      font-size: 15px;
      font-weight: 700;
      border: 1px solid rgba(238, 77, 45, 0.3);
      box-shadow: 0 4px 12px rgba(238, 77, 45, 0.15);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 20px 0;
    }

    .stat-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 16px;
    }

    .stat-val {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
    }

    .stat-val.green {
      color: #5fe8cc;
    }

    .stat-lbl {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Top Item styling */
    .top-item-highlight {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
      text-align: center;
    }

    .top-item-emoji {
      font-size: 48px;
      animation: pulseEmoji 3s infinite ease-in-out;
    }

    @keyframes pulseEmoji {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.1);
        filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.3));
      }

      100% {
        transform: scale(1);
      }
    }

    .top-item-name {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Percentile Bar */
    .pct-bar-bg {
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
      margin: 16px 0;
    }

    .pct-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #5fe8cc, #26aa99);
      width: 0%;
      border-radius: 5px;
      transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Year Chart */
    .year-chart {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 20px 0;
    }

    .year-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .year-label {
      font-size: 13px;
      font-weight: 700;
      width: 45px;
      color: var(--text-muted);
    }

    .year-bar-track {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .year-bar-fill {
      height: 100%;
      background: rgba(255, 255, 255, 0.4);
      width: 0%;
      border-radius: 4px;
      transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .year-bar-fill.active-year {
      background: linear-gradient(90deg, #5fe8cc, #26aa99);
    }

    .year-val {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      min-width: 80px;
      text-align: right;
    }

    /* CTA Section */
    .cta-card {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .cta-btn {
      display: inline-flex;
      background: linear-gradient(135deg, var(--primary) 0%, #ff8a5a 100%);
      color: white !important;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      padding: 16px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(238, 77, 45, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
      justify-content: center;
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(238, 77, 45, 0.5);
    }

    .cta-btn:active {
      transform: translateY(0);
    }

    .sticker-slogan {
      background: rgba(255, 255, 255, 0.07);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 13px;
      color: #ffb86c;
      font-weight: 700;
      margin: 10px 0;
      animation: rotateSticker 6s infinite ease-in-out;
    }

    @keyframes rotateSticker {
      0% {
        transform: rotate(-2deg);
      }

      50% {
        transform: rotate(2deg) scale(1.03);
      }

      100% {
        transform: rotate(-2deg);
      }
    }

    /* Footer Brand mark */
    .story-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 16px;
      margin-top: 20px;
    }

    .brand-logo {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--text-muted);
    }

    .brand-date {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.28);
    }

    /* Touch navigation overlay hint */
    .story-nav-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      pointer-events: none;
      display: flex;
    }

    .nav-zone-left {
      width: 30%;
      height: 100%;
      pointer-events: auto;
      cursor: w-resize;
    }

    .nav-zone-right {
      width: 70%;
      height: 100%;
      pointer-events: auto;
      cursor: e-resize;
    }

    /* Error */
    .error-msg {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.7);
      position: relative;
      z-index: 10;
    }

    .error-msg h2 {
      color: #fff;
      margin-bottom: 10px;
      font-size: 22px;
    }

    /* Confetti canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
    }

    /* Actions Bar */
    .actions-panel {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 12px;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 16px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      width: calc(100% - 32px);
      max-width: 440px;
    }

    .action-btn {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      outline: none;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    .action-btn.active {
      background: linear-gradient(135deg, #ee4d2d 0%, #ff8a5a 100%);
      border: none;
      box-shadow: 0 4px 15px rgba(238, 77, 45, 0.3);
    }

    .action-btn.active:hover {
      box-shadow: 0 6px 20px rgba(238, 77, 45, 0.45);
    }

    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      text-align: center;
      width: calc(100% - 40px);
      max-width: 400px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>
  <div class="fluid-bg"></div>
  <canvas id="confetti-canvas"></canvas>

  <div class="story-container" id="story-frame">
    <!-- Story Progress Bar -->
    <div class="story-progress-bar" id="story-pb">
      <div class="story-progress-segment">
        <div class="story-progress-fill"></div>
      </div>
      <div class="story-progress-segment">
        <div class="story-progress-fill"></div>
      </div>
      <div class="story-progress-segment">
        <div class="story-progress-fill"></div>
      </div>
      <div class="story-progress-segment">
        <div class="story-progress-fill"></div>
      </div>
      <div class="story-progress-segment">
        <div class="story-progress-fill"></div>
      </div>
    </div>

    <!-- Navigation touch overlays -->
    <div class="story-nav-overlay">
      <div class="nav-zone-left" id="nav-left"></div>
      <div class="nav-zone-right" id="nav-right"></div>
    </div>

    <!-- Slides wrap -->
    <div class="slides-wrap" id="slides-wrap">
      <!-- Will be rendered dynamically via JS -->
    </div>
  </div>

  <!-- Actions Panel -->
  <div id="actions-panel" class="actions-panel" style="display: none;">
    <button id="btn-download-img" class="action-btn active">💾 Tải ảnh vuông</button>
    <button id="btn-copy-img" class="action-btn">📋 Sao chép ảnh</button>
  </div>

  <!-- Toast Message -->
  <div id="toast" class="toast"></div>

  <div id="error-root" style="display: none; width: 100%; max-width: 480px;"></div>

  <script>
    (function () {
      /* ====================================================
         Helpers & Share Image Generation
       ==================================================== */
      async function generateSquareShareCard(d) {
        try { await document.fonts.ready; } catch (e) { }

        const W = 1080;
        const H = 1080; // Always square

        const canvas = document.createElement('canvas');
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext('2d');

        const FONT = "Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
        const PAD = 80;

        // Premium Light Theme with a subtle Shopee orange gradient
        const tColors = {
          bg: ['#ffffff', '#fff5f2', '#ffece5'],
          accent: '#ee4d2d',
          secondary: '#26aa99',
          surface: '#ffffff',
          surfaceBorder: 'rgba(238, 77, 45, 0.08)',
          text: '#1f2937',
          textMuted: '#4b5563',
          textFaint: '#9ca3af',
          divider: 'rgba(238, 77, 45, 0.06)',
          shadow: 'rgba(238, 77, 45, 0.05)'
        };

        // 1. Background
        const bgGrad = ctx.createLinearGradient(0, 0, W, H);
        bgGrad.addColorStop(0, tColors.bg[0]);
        bgGrad.addColorStop(0.5, tColors.bg[1]);
        bgGrad.addColorStop(1, tColors.bg[2]);
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);

        // 2. Decorative Elements
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#fde8e0';
        ctx.beginPath(); ctx.arc(W * 0.9, H * 0.1, 400, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(W * 0.1, H * 0.8, 300, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;

        function txt(t, x, y, size, weight, color, align = 'left') {
          ctx.font = `${weight} ${size}px ${FONT}`;
          ctx.fillStyle = color || tColors.text;
          ctx.textAlign = align;
          ctx.fillText(t, x, y);
        }

        function roundedRectWithShadow(ctx, x, y, w, h, r, fillColor, shadowColor) {
          if (shadowColor) {
            ctx.shadowColor = shadowColor;
            ctx.shadowBlur = 30;
            ctx.shadowOffsetY = 15;
          } else {
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
          }
          ctx.beginPath();
          ctx.roundRect(x, y, w, h, r);
          ctx.closePath();
          if (fillColor) {
            ctx.fillStyle = fillColor;
            ctx.fill();
          }
          ctx.shadowColor = 'transparent';
          ctx.shadowBlur = 0;
          ctx.shadowOffsetY = 0;
        }

        function truncate(str, maxLen) {
          if (!str) return '';
          const s = String(str);
          return s.length > maxLen ? s.substring(0, maxLen - 1) + '…' : s;
        }

        function fmtVNDCanvas(n) {
          if (n < 0) return '***';
          n = Math.round(n || 0);
          if (n >= 1000000000) return (n / 1000000000).toFixed(1).replace('.0', '') + ' tỷ';
          if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'tr';
          if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'k';
          return n.toLocaleString('vi-VN');
        }

        // 3. Header
        const headY = 90;
        txt('tr4n.github.io/shopee-stats', PAD, headY - 3, 24, '800', tColors.textMuted);
        txt('Tổng Quan Chi Tiêu', PAD, headY + 70, 56, '900', tColors.text);

        // Accent line
        const lineGrad = ctx.createLinearGradient(PAD, 0, W - PAD, 0);
        lineGrad.addColorStop(0, tColors.accent);
        lineGrad.addColorStop(0.5, tColors.divider);
        lineGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = lineGrad;
        ctx.fillRect(PAD, headY + 110, W - PAD * 2, 4);

        // Two-column layout
        const colW = 420;
        const leftX = PAD;
        const rightX = W - PAD - colW; // 580

        // Amount Section
        const amtY = headY + 170;
        const amtStr = d.t < 0 ? '***' : fmtVNDCanvas(d.t) + 'đ';
        const amtSize = amtStr.length > 14 ? 60 : 72;

        txt(amtStr, leftX, amtY + 20, amtSize, '900', tColors.text);

        const rankStr = RANKS[d.r] || RANKS[2];
        ctx.font = `800 24px ${FONT}`;
        const rankW = Math.min(ctx.measureText(rankStr).width + 50, colW);
        roundedRectWithShadow(ctx, leftX, amtY + 50, rankW, 46, 23, tColors.surface, tColors.shadow);
        ctx.strokeStyle = tColors.surfaceBorder;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.roundRect(leftX, amtY + 50, rankW, 46, 23); ctx.stroke();
        txt(rankStr, leftX + 25, amtY + 81, 20, '800', tColors.accent);

        // Percentile Card
        const pctY = amtY + 130;
        roundedRectWithShadow(ctx, leftX, pctY, colW, 140, 24, tColors.surface, tColors.shadow);
        ctx.strokeStyle = tColors.surfaceBorder;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.roundRect(leftX, pctY, colW, 140, 24); ctx.stroke();

        txt(`Hơn ${d.p}% người dùng VN`, leftX + 30, pctY + 45, 22, '700', tColors.text);
        txt(`Hệ thống Shopee Analytics`, leftX + 30, pctY + 80, 16, '500', tColors.textMuted);

        const barX = leftX + 30, barY2 = pctY + 105, barW = colW - 60, barH = 8;
        roundedRectWithShadow(ctx, barX, barY2, barW, barH, 4, '#f3f4f6');
        if (d.p > 0) {
          const progGrad = ctx.createLinearGradient(barX, 0, barX + barW * (d.p / 100), 0);
          progGrad.addColorStop(0, tColors.accent);
          progGrad.addColorStop(1, tColors.secondary);
          roundedRectWithShadow(ctx, barX, barY2, barW * (d.p / 100), barH, 4, progGrad);
        }

        // Top Item Card
        const hasTopItem = typeof d.ti === 'string' && d.ti.length > 0 && d.ti !== 'Không có thông tin sản phẩm' && d.ti !== 'Sản phẩm đã ẩn';
        if (hasTopItem) {
          const topItemY = pctY + 175;
          roundedRectWithShadow(ctx, leftX, topItemY, colW, 160, 24, tColors.surface, tColors.shadow);
          ctx.strokeStyle = tColors.surfaceBorder;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.roundRect(leftX, topItemY, colW, 160, 24); ctx.stroke();

          txt('SẢN PHẨM MUA NHIỀU NHẤT', leftX + 30, topItemY + 40, 16, '700', tColors.textMuted);
          const itemName = truncate(d.ti, 24);
          txt(itemName, leftX + 30, topItemY + 85, 24, '800', tColors.text);
          txt('Đã đồng hành cùng ví tiền của bạn!', leftX + 30, topItemY + 125, 16, '600', tColors.textMuted);
        }

        // Right Column (Stats Grid)
        const drawStatBox = (x, y, w, h, label, val, valColor, icon) => {
          roundedRectWithShadow(ctx, x, y, w, h, 24, tColors.surface, tColors.shadow);
          ctx.strokeStyle = tColors.surfaceBorder;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.roundRect(x, y, w, h, 24); ctx.stroke();

          txt(icon, x + 30, y + 45, 28, '400', tColors.text);
          txt(label, x + 30, y + 85, 16, '600', tColors.textMuted);
          txt(val, x + 30, y + 130, 32, '800', valColor);
        };

        const boxH = 150;
        const boxYStart = headY + 160;

      function fmtVND(n) {
        if (n < 0) return '***';
        n = Math.round(n || 0);
        if (n >= 1000000000) return (n / 1000000000).toFixed(1).replace('.0', '') + ' tỷ';
        if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + ' triệu';
        if (n >= 1000) return Math.round(n / 1000) + 'k';
        return n.toLocaleString('vi-VN');
      }
      function fmtNum(n) { return Math.round(n || 0).toLocaleString('vi-VN'); }
      function fmtDate(ts) {
        if (!ts) return '';
        const d = new Date(ts * 1000);
        return `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
      }
      function escHtml(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      /* ====================================================
         Counter animation
       ==================================================== */
      function animateCounter(el, targetText, duration) {
        const match = targetText.match(/^([\d,\.]+)(.*)$/);
        if (!match) { el.textContent = targetText; return; }

        const numStr = match[1].replace(/,/g, '');
        const suffix = match[2];
        const target = parseFloat(numStr);
        const isFloat = numStr.includes('.');
        const decimals = isFloat ? (numStr.split('.')[1] || '').length : 0;

        const start = performance.now();
        function step(now) {
          const elapsed = now - start;
          const progress = Math.min(elapsed / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const current = target * eased;
          const formatted = isFloat
            ? current.toFixed(decimals).replace(/\B(?=(\d{3})+(?!\d))/g, ',')
            : Math.round(current).toLocaleString('vi-VN');
          el.textContent = formatted + suffix;
          if (progress < 1) requestAnimationFrame(step);
          else el.textContent = targetText;
        }
        requestAnimationFrame(step);
      }

      /* ====================================================
         Confetti (for top spenders: percentile >= 80)
       ==================================================== */
      let confettiActive = false;
      function launchConfetti() {
        if (confettiActive) return;
        confettiActive = true;
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = Array.from({ length: 90 }, () => ({
          x: Math.random() * canvas.width,
          y: -20 - Math.random() * 80,
          vx: (Math.random() - 0.5) * 3,
          vy: 2 + Math.random() * 3,
          rot: Math.random() * 360,
          rotV: (Math.random() - 0.5) * 8,
          w: 8 + Math.random() * 6,
          h: 4 + Math.random() * 4,
          color: ['#ee4d2d', '#ff8a5a', '#5fe8cc', '#ffd700', '#fff'][Math.floor(Math.random() * 5)],
          alpha: 1
        }));

        let frame = 0;
        function draw() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          let alive = false;
          for (const p of particles) {
            p.x += p.vx;
            p.y += p.vy;
            p.rot += p.rotV;
            p.vy += 0.06;
            if (frame > 80) p.alpha -= 0.018;
            if (p.alpha <= 0) continue;
            alive = true;
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot * Math.PI / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
          }
          frame++;
          if (alive) requestAnimationFrame(draw);
          else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            confettiActive = false;
          }
        }
        requestAnimationFrame(draw);
      }

      /* ====================================================
         Parse URL data
       ==================================================== */
      function parseData() {
        try {
          // 1. Try matching s= (new format)
          const matchS = location.hash.match(/[#&]s=([^&]+)/);
          if (matchS) {
            const hashVal = decodeURIComponent(matchS[1]);
            if (hashVal.startsWith('3-')) {
              // Version 3 (Optimized raw delimited URL-safe format)
              const parts = hashVal.split('-');
              const finalTotal = parts[1] === 'n' ? -1 : parseInt(parts[1], 36);
              const totalOrders = parseInt(parts[2], 36);
              const totalItems = parseInt(parts[3], 36);
              const finalSaved = parts[4] === 'n' ? -1 : parseInt(parts[4], 36);
              const tsVal = parseInt(parts[5], 36);

              const ydStr = parts[6] || '';
              const topItemB64Url = parts.slice(7).join('-');

              let finalTopItem = '';
              if (topItemB64Url) {
                try {
                  let b64 = topItemB64Url.replace(/-/g, '+').replace(/_/g, '/');
                  while (b64.length % 4) b64 += '=';
                  finalTopItem = decodeURIComponent(escape(atob(b64)));
                } catch (e) {
                  console.error("Failed to decode top item:", e);
                }
              }

              let yd = [];
              if (ydStr) {
                const ydParts = ydStr.split('_');
                for (let i = 0; i < ydParts.length; i += 2) {
                  if (ydParts[i] && ydParts[i + 1]) {
                    const fullYear = parseInt(ydParts[i], 10) + 2000;
                    const val = ydParts[i + 1] === 'n' ? -1 : parseInt(ydParts[i + 1], 36);
                    yd.push([fullYear, val]);
                  }
                }
              }

              // Calculate rankVal and beatVal dynamically
              const rankVal = finalTotal <= 10000000 ? 1 : (finalTotal <= 50000000 ? 2 : (finalTotal < 80000000 ? 3 : 4));

              const getBeat = (t) => {
                const thresholds = [
                  { max: 1000000, beat: 20 },
                  { max: 5000000, beat: 45 },
                  { max: 15000000, beat: 65 },
                  { max: 35000000, beat: 80 },
                  { max: 70000000, beat: 90 },
                  { max: 120000000, beat: 95 },
                  { max: 250000000, beat: 98 },
                  { max: Infinity, beat: 99 }
                ];
                for (const item of thresholds) {
                  if (t <= item.max) return item.beat;
                }
                return 99;
              };
              const beat = getBeat(finalTotal);

              return {
                r: rankVal,
                p: beat,
                t: finalTotal,
                o: totalOrders,
                ip: totalItems,
                s: finalSaved,
                ts: tsVal,
                ti: finalTopItem,
                yd: yd
              };
            } else {
              // Version 1 or 2 (Base64 encoded)
              const rawStr = decodeURIComponent(escape(atob(hashVal)));
              const parts = rawStr.split('|');
              if (parts.length >= 9) {
                const version = parseInt(parts[0], 10);
                if (version === 2) {
                  const rankVal = parseInt(parts[1], 10);
                  const beat = parseInt(parts[2], 10);

                  const finalTotal = parts[3] === 'n' ? -1 : parseInt(parts[3], 36);
                  const totalOrders = parseInt(parts[4], 36);
                  const totalItems = parseInt(parts[5], 36);
                  const finalSaved = parts[6] === 'n' ? -1 : parseInt(parts[6], 36);
                  const tsVal = parseInt(parts[7], 36);

                  const ydStr = parts[parts.length - 1] || '';
                  const finalTopItem = parts.slice(8, parts.length - 1).join('|');

                  let yd = [];
                  if (ydStr) {
                    yd = ydStr.split(';').map(item => {
                      const sub = item.split(',');
                      const fullYear = parseInt(sub[0], 10) + 2000;
                      const val = sub[1] === 'n' ? -1 : parseInt(sub[1], 36);
                      return [fullYear, val];
                    });
                  }

                  return {
                    r: rankVal,
                    p: beat,
                    t: finalTotal,
                    o: totalOrders,
                    ip: totalItems,
                    s: finalSaved,
                    ts: tsVal,
                    ti: finalTopItem,
                    yd: yd
                  };
                } else {
                  // Fallback for version 1 (Base10 delimited string)
                  const rankVal = parseInt(parts[1], 10);
                  const beat = parseInt(parts[2], 10);
                  const finalTotal = parseFloat(parts[3]);
                  const totalOrders = parseInt(parts[4], 10);
                  const totalItems = parseInt(parts[5], 10);
                  const finalSaved = parseFloat(parts[6]);
                  const tsVal = parseInt(parts[7], 10);

                  const ydStr = parts[parts.length - 1] || '';
                  const finalTopItem = parts.slice(8, parts.length - 1).join('|');

                  let yd = [];
                  if (ydStr) {
                    yd = ydStr.split(';').map(item => {
                      const sub = item.split(',');
                      return [sub[0], parseFloat(sub[1])];
                    });
                  }

                  return {
                    r: rankVal,
                    p: beat,
                    t: finalTotal,
                    o: totalOrders,
                    ip: totalItems,
                    s: finalSaved,
                    ts: tsVal,
                    ti: finalTopItem,
                    yd: yd
                  };
                }
              }
            }
          }

          // 2. Fallback to older d= format
          const matchD = location.hash.match(/[#&]d=([^&]+)/);
          if (!matchD) return null;
          return JSON.parse(decodeURIComponent(escape(atob(matchD[1]))));
        } catch (err) {
          console.error("Failed to parse sharing data:", err);
          return null;
        }
      }

        let progress = 0;
        let lastTime = performance.now();
        let isPaused = false;
        const slideDuration = 5000;
        let animationFrameId = null;

        function showSlide(idx) {
          currentIdx = idx;
          progress = 0;

          slides.forEach((slide, sIdx) => {
            slide.classList.toggle("active", sIdx === idx);
          });

          progressFills.forEach((fill, fIdx) => {
            if (fIdx < idx) {
              fill.style.width = "100%";
            } else {
              fill.style.width = "0%";
            }
          });

          if (idx === 0) {
            const totalEl = document.getElementById("welcome-spent");
            if (totalEl) animateCounter(totalEl, totalFmt, 1200);
            if (beat >= 80) setTimeout(launchConfetti, 300);
          } else if (idx === 1) {
            const fill = document.getElementById("pct-bar-fill");
            if (fill) fill.style.width = beat + '%';

            const svOrders = document.getElementById("stat-orders");
            const svItems = document.getElementById("stat-items");

            if (svItems) animateCounter(svItems, fmtNum(d.ip), 900);
            if (svSaved) animateCounter(svSaved, savedFmt, 900);
            if (beat >= 80) setTimeout(launchConfetti, 300);
          } else if (idx === 3) {

              setTimeout(() => {
                bar.style.width = bar.getAttribute("data-pct") + '%';
              }, bIdx * 100);

        }

        function nextSlide() {
          if (currentIdx < nSlides - 1) {
            showSlide(currentIdx + 1);
          } else {
            showSlide(0);
          }
        }

        function prevSlide() {
          if (currentIdx > 0) {
            showSlide(currentIdx - 1);
          } else {
            showSlide(0);
          }
        }

        function loop(now) {
          const delta = now - lastTime;
          lastTime = now;

          if (!isPaused) {
            progress += (delta / slideDuration) * 100;
            if (progress >= 100) {
              progress = 0;
              nextSlide();
            } else {
              if (progressFills[currentIdx]) {
                progressFills[currentIdx].style.width = `${progress}%`;
              }
            }
          }
          animationFrameId = requestAnimationFrame(loop);
        }

        const storyFrame = document.getElementById("story-frame");

        document.getElementById("nav-left").addEventListener("click", (e) => {
          e.stopPropagation();
          prevSlide();
        });

        document.getElementById("nav-right").addEventListener("click", (e) => {
          e.stopPropagation();
          nextSlide();
        });

        const pauseStart = () => { isPaused = true; };
        const pauseEnd = () => { isPaused = false; lastTime = performance.now(); };

        storyFrame.addEventListener("mousedown", pauseStart);
        storyFrame.addEventListener("mouseup", pauseEnd);
        storyFrame.addEventListener("mouseleave", pauseEnd);
        storyFrame.addEventListener("touchstart", pauseStart);
        storyFrame.addEventListener("touchend", pauseEnd);

        showSlide(0);
        lastTime = performance.now();
        animationFrameId = requestAnimationFrame(loop);
      }

      /* ====================================================
         Boot
       ==================================================== */
      const data = parseData();
      if (!data || !data.t) {
        renderError();
      } else {
        renderSlideshow(data);
        setupActions(data);
      }
    })();
  </script>
</body>

</html>
